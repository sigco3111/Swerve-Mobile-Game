<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>스월브 - 모바일 3D 러닝 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HUD Overlay -->
    <div id="hud" class="hidden">
        <div id="hud-left">
            <div id="lives-container">
                <span class="life-icon active" id="life-1"></span>
                <span class="life-icon active" id="life-2"></span>
                <span class="life-icon active" id="life-3"></span>
            </div>
            <div id="ghost-indicator" class="hidden">
                <span id="ghost-text">무적</span>
                <svg id="ghost-ring" viewBox="0 0 36 36">
                    <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                    <circle id="ghost-timer-ring" cx="18" cy="18" r="16" fill="none" stroke="#00ffff" stroke-width="2"
                        stroke-dasharray="100.53" stroke-dashoffset="0" stroke-linecap="round"
                        transform="rotate(-90 18 18)"/>
                </svg>
            </div>
            <div id="powerup-bar">
                <div class="powerup-slot hidden" id="slot-magnet" data-kind="magnet">
                    <svg viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                        <circle class="ring-fg" cx="18" cy="18" r="16" fill="none" stroke="#ff00aa" stroke-width="2"
                            stroke-dasharray="100.53" stroke-dashoffset="0" stroke-linecap="round"
                            transform="rotate(-90 18 18)"/>
                    </svg>
                    <span class="powerup-letter">M</span>
                </div>
                <div class="powerup-slot hidden" id="slot-slowmo" data-kind="slow_mo">
                    <svg viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
                        <circle class="ring-fg" cx="18" cy="18" r="16" fill="none" stroke="#7766ff" stroke-width="2"
                            stroke-dasharray="100.53" stroke-dashoffset="0" stroke-linecap="round"
                            transform="rotate(-90 18 18)"/>
                    </svg>
                    <span class="powerup-letter" style="color:#7766ff">T</span>
                </div>
                <div class="powerup-slot hidden" id="slot-shield" data-kind="shield">
                    <svg viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="16" fill="none" stroke="#00ddff" stroke-width="2" stroke-opacity="0.4"/>
                        <circle cx="18" cy="18" r="16" fill="none" stroke="#00ddff" stroke-width="2"
                            stroke-dasharray="100.53" stroke-dashoffset="0" stroke-linecap="round"
                            transform="rotate(-90 18 18)"/>
                    </svg>
                    <span class="powerup-letter" style="color:#00ddff">S</span>
                </div>
            </div>
        </div>
        <div id="hud-center">
            <div id="score-display">0</div>
            <div id="combo-display" class="hidden">
                <span id="combo-count">0</span><span id="combo-mult">×1</span>
            </div>
        </div>
        <div id="hud-right">
            <div id="highscore-display">최고: 0</div>
            <button id="pause-btn" class="hidden" type="button">||</button>
        </div>
    </div>

    <!-- Level Up Notification -->
    <div id="level-up" class="hidden">
        <span id="level-up-text">레벨 1</span>
    </div>

    <!-- Title Screen -->
    <div id="title-screen">
        <h1 id="game-title">스월브</h1>
        <div id="title-highscore">최고 기록: 0</div>
        <div id="tap-to-start">터치하여 시작</div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
        <h2 id="game-over-title">게임 오버</h2>
        <div id="final-score-label">점수</div>
        <div id="final-score">0</div>
        <div id="final-highscore">최고: 0</div>
        <div id="achievements-summary">업적 0/6</div>
        <div id="restart-btn">터치하여 다시 시작</div>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay">
        <div id="tutorial-text">
            마블을 터치한 채 움직여 조작<br>
            좌우로 스와이프하여 회피
        </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pause-overlay" class="hidden">
        <h2 id="pause-title">일시정지</h2>
        <div id="settings-panel">
            <div class="setting-row">
                <span class="setting-label">사운드</span>
                <button class="toggle on" data-setting="sound" type="button" aria-pressed="true"></button>
            </div>
            <div class="setting-row">
                <span class="setting-label">진동</span>
                <button class="toggle on" data-setting="haptic" type="button" aria-pressed="true"></button>
            </div>
            <div class="setting-row">
                <span class="setting-label">색약 모드</span>
                <button class="toggle" data-setting="colorblind" type="button" aria-pressed="false"></button>
            </div>
        </div>
        <div id="achievements-panel">
            <div id="achievements-section-title">업적</div>
            <div id="achievements-list"></div>
        </div>
        <div id="resume-btn">터치하여 재개</div>
    </div>

    <!-- Damage flash — kept in the DOM and toggled, never rebuilt -->
    <div id="hit-flash"></div>

    <!-- Achievement toast — slides in from the right, holds, slides out -->
    <div id="achievement-toast">
        <span id="achievement-toast-icon">★</span>
        <div id="achievement-toast-body">
            <div id="achievement-toast-title">업적 해제</div>
            <div id="achievement-toast-name"></div>
        </div>
    </div>

    <!-- Canvas container -->
    <div id="game-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://esm.sh/cannon-es@0.20.0"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
